<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con XMTP v3 + Ethers v6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        #status {
            word-break: break-word;
        }

        .hidden {
            display: none;
        }

        .message-bubble {
            max-width: 75%;
            padding: 0.75rem 1rem;
            border-radius: 1.25rem;
            word-wrap: break-word;
        }

        .sent {
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 0.25rem;
            align-self: flex-end;
        }

        .received {
            background-color: #374151;
            color: #d1d5db;
            border-bottom-left-radius: 0.25rem;
            align-self: flex-start;
        }

        #messagesContainer {
            scroll-behavior: smooth;
        }

        /* Estilos para la transición del banner */
        #notificationBanner {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
    </style>
</head>

<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">

    <div class="relative w-full max-w-lg p-6 sm:p-8 space-y-6 bg-gray-800 rounded-2xl shadow-lg">
        
        <!-- BANNER DE NOTIFICACIÓN -->
        <div id="notificationBanner" class="hidden absolute top-0 left-1/2 -translate-x-1/2 w-11/12 max-w-md mt-4 bg-indigo-500 text-white p-3 rounded-lg shadow-xl cursor-pointer z-10">
            <div class="flex justify-between items-center">
                <div>
                    <p id="notificationSender" class="font-bold text-sm"></p>
                    <p id="notificationContent" class="text-sm truncate"></p>
                </div>
                <button id="closeNotification" class="text-2xl leading-none text-white/70 hover:text-white">&times;</button>
            </div>
        </div>

        <!-- SECCIÓN DE BILLETERA -->
        <div class="text-center">
            <h1 class="text-3xl font-bold text-white">Chat Descentralizado</h1>
            <p class="text-gray-400 mt-2">Construido con XMTP y Ethers.js</p>
        </div>
        <button id="createWalletButton"
            class="w-full px-4 py-3 font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-indigo-500 transition-colors duration-200">
            Crear/Cargar Billetera e Iniciar
        </button>
        <div id="status"
            class="text-center text-gray-400 p-4 bg-gray-700/50 rounded-lg min-h-[4rem] flex items-center justify-center">
            Cargando...
        </div>
        <div class="space-y-2 text-center text-sm">
            <div id="walletInfoContainer" class="hidden items-center justify-center space-x-2">
                <div id="address" class="text-gray-400 break-all"></div>
                <button id="copyAddressButton" title="Copiar dirección"
                    class="text-gray-500 hover:text-white transition-colors duration-200 p-1 rounded-full hover:bg-gray-700">
                    <svg id="copyIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                    </svg>
                    <svg id="checkIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" class="hidden text-green-400">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
                <button id="forgetWalletButton" title="Olvidar billetera y crear una nueva"
                    class="text-gray-500 hover:text-white transition-colors duration-200 p-1 rounded-full hover:bg-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                        <path d="M21 3v5h-5" />
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                        <path d="M3 21v-5h5" />
                    </svg>
                </button>
            </div>
            <div id="privateKey" class="text-red-400 break-all font-mono text-xs"></div>
        </div>

        <!-- SECCIÓN DE CHAT -->
        <div id="chatContainer" class="hidden space-y-4">
            <hr class="border-gray-600">
            <div>
                <label for="recipientAddressInput" class="block text-sm font-medium text-gray-300 mb-2">Chatear con
                    (dirección ETH / inboxId):</label>
                <input type="text" id="recipientAddressInput" placeholder="0x... y presiona Tab o haz clic fuera"
                    class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
            </div>
            <div id="messagesContainer"
                class="h-64 overflow-y-auto bg-gray-900/50 p-4 rounded-lg flex flex-col space-y-4"></div>
            <form id="sendMessageForm" class="flex items-center space-x-2">
                <input type="text" id="messageInput" placeholder="Escribe un mensaje..."
                    class="flex-grow bg-gray-700 border border-gray-600 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                    required>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-2 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Módulos de Ethers.js y XMTP SDK -->
    <script type="module">
                       import { Client } from '@xmtp/browser-sdk';
                window.Client = Client;
                import { Wallet, ethers, isAddress, getBytes  } from 'ethers';
                window.Wallet = Wallet;
                window.isAddress = isAddress;
                window.ethers = ethers;
                window.getBytes = getBytes
    </script>

    <script>
        // --- Variables Globales ---
        var xmtpClient = null;
        var currentWallet = null;
        var currentConversation = null;
        var notificationTimeout = null;

        // --- DOM Elements ---
        const createWalletButton = document.getElementById('createWalletButton');
        const forgetWalletButton = document.getElementById('forgetWalletButton');
        const copyAddressButton = document.getElementById('copyAddressButton');
        const walletInfoContainer = document.getElementById('walletInfoContainer');
        const chatContainer = document.getElementById('chatContainer');
        const recipientAddressInput = document.getElementById('recipientAddressInput');
        const messagesContainer = document.getElementById('messagesContainer');
        const sendMessageForm = document.getElementById('sendMessageForm');
        const messageInput = document.getElementById('messageInput');
        const statusEl = document.getElementById('status');
        const addressEl = document.getElementById('address');
        const privateKeyEl = document.getElementById('privateKey');
        const notificationBanner = document.getElementById('notificationBanner');
        const notificationSender = document.getElementById('notificationSender');
        const notificationContent = document.getElementById('notificationContent');
        const closeNotification = document.getElementById('closeNotification');

        const WALLET_STORAGE_KEY = 'xmtp-chat-wallet';

        // --- Funciones Principales ---

        async function initializeWalletAndXmtp(wallet, isNewWallet = false) {
            currentWallet = wallet;
            updateWalletUI(wallet, isNewWallet);
            statusEl.textContent = "Conectando al cliente de XMTP...";

            try {
                     signer = {
                    type: "EOA",
                    getIdentifier: () => ({ identifier: wallet.address, identifierKind: "Ethereum" }), //v2
                    signMessage: async (message) => getBytes(await wallet.signMessage(message)),
                };
                // Usamos el wallet de ethers como signer para el cliente XMTP
                xmtpClient = await Client.create(signer, { env: 'dev' });
                statusEl.textContent = `¡Conectado! Tu inboxID en la red XMTP es: ${xmtpClient.inboxId}`;
                console.log("¡Conectado a XMTP!");
                console.log('Tu dirección:', xmtpClient.address);
                console.log('Tu Inbox ID:', xmtpClient.inboxId);

                chatContainer.classList.remove('hidden');
                listenForIncomingMessages();
            } catch (error) {
                console.error("Error al inicializar XMTP:", error);
                statusEl.textContent = `Error: ${error.message}`;
                resetUI();
            }
        }

        async function listenForIncomingMessages() {
            if (!xmtpClient) return;
            console.log("Escuchando todos los mensajes nuevos...");
            
            const stream = await xmtpClient.conversations.streamAllMessages();
            
            for await (const message of stream) {
                // Ignorar mensajes enviados por nosotros mismos
                if (message.senderAddress === xmtpClient.address) {
                    continue;
                }

                console.log(`Nuevo mensaje de ${message.senderAddress}: "${message.content}"`);

                // **LA LÓGICA CORREGIDA ESTÁ AQUÍ**
                // Comprobar si hay una conversación activa y si el mensaje pertenece a ella
                if (currentConversation && message.conversation.peerAddress === currentConversation.peerAddress) {
                    // Si es así, añadir el mensaje directamente a la UI
                    addMessageToUI(message, 'received');
                } else {
                    // Si no, mostrar una notificación
                    showNotification(message);
                }
            }
        }


        async function startOrLoadConversation(recipientAddress) {
            if (!xmtpClient || !isAddress(recipientAddress)) {
                // También podríamos comprobar si es un inboxId válido aquí
                statusEl.textContent = "Por favor, introduce una dirección Ethereum válida.";
                return;
            }
            if (recipientAddress.toLowerCase() === currentWallet.address.toLowerCase()) {
                statusEl.textContent = "No puedes chatear contigo mismo.";
                messagesContainer.innerHTML = '';
                currentConversation = null;
                return;
            }

            statusEl.textContent = `Buscando a ${recipientAddress.slice(0, 6)}... en la red XMTP.`;
            try {
                // Iniciar una nueva conversación
                const newConversation = await xmtpClient.conversations.newConversation(recipientAddress);
                currentConversation = newConversation;
                await loadAndDisplayMessages(currentConversation);
            } catch (e) {
                statusEl.textContent = `Error: No se pudo iniciar la conversación. ¿Está la dirección en la red?`;
                console.error(e);
                currentConversation = null;
                messagesContainer.innerHTML = '';
            }
        }

        async function loadAndDisplayMessages(conv) {
            if (!conv) return;

            messagesContainer.innerHTML = ''; 
            statusEl.textContent = `Cargando historial con ${conv.peerAddress.slice(0, 6)}...`;
            const existingMessages = await conv.messages();
            for (const message of existingMessages) {
                const type = message.senderAddress === currentWallet.address ? 'sent' : 'received';
                addMessageToUI(message, type);
            }
            statusEl.textContent = `Chateando con ${conv.peerAddress.slice(0, 6)}...`;
            // Ya no necesitamos un stream individual aquí, el stream global `listenForIncomingMessages` se encarga.
        }
        
        // --- Funciones de UI y Utilidades ---

        function showNotification(message) {
            if (notificationTimeout) clearTimeout(notificationTimeout);

            notificationSender.textContent = `Nuevo mensaje de: ${message.senderAddress.slice(0, 6)}...${message.senderAddress.slice(-4)}`;
            notificationContent.textContent = message.content;
            
            notificationBanner.classList.remove('hidden', 'opacity-0', '-translate-y-16');
            notificationBanner.classList.add('opacity-100', 'translate-y-0');

            // Acción al hacer clic en el banner: cambiar a esa conversación
            notificationBanner.onclick = () => {
                recipientAddressInput.value = message.senderAddress;
                // Disparamos el evento 'blur' para que la lógica de cambio de conversación se active
                recipientAddressInput.dispatchEvent(new Event('blur'));
                hideNotification();
            };

            // Ocultar automáticamente después de 5 segundos
            notificationTimeout = setTimeout(hideNotification, 5000);
        }

        function hideNotification() {
             if (notificationTimeout) clearTimeout(notificationTimeout);
             notificationBanner.classList.add('opacity-0', '-translate-y-16');
             // Esperar a que la transición termine para añadir 'hidden'
             setTimeout(() => {
                notificationBanner.classList.add('hidden');
             }, 300);
        }

        function addMessageToUI(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.textContent = message.content;
            messageDiv.className = `message-bubble ${type}`;
            messagesContainer.appendChild(messageDiv);
            // Hacer scroll hasta el final para ver el nuevo mensaje
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function updateWalletUI(wallet, isNewWallet) {
            createWalletButton.classList.add('hidden');
            walletInfoContainer.classList.remove('hidden');
            walletInfoContainer.classList.add('flex');

            const userAddress = wallet.address;
            addressEl.innerHTML = `<strong>Tú:</strong> ${userAddress.slice(0, 6)}...${userAddress.slice(-4)}`;
            privateKeyEl.innerHTML = isNewWallet
                ? `<strong class="text-red-300">Clave Privada (¡guárdala!):</strong> ${wallet.privateKey}`
                : '<span class="text-gray-500">Clave privada cargada desde memoria.</span>';
        }

        function resetUI() {
            addressEl.textContent = '';
            privateKeyEl.textContent = '';
            walletInfoContainer.classList.add('hidden');
            walletInfoContainer.classList.remove('flex');
            chatContainer.classList.add('hidden');
            createWalletButton.classList.remove('hidden');
            createWalletButton.disabled = false;
            createWalletButton.textContent = "Crear/Cargar Billetera e Iniciar";
            currentWallet = null;
            xmtpClient = null;
            currentConversation = null;
        }

        function copyAddress() {
            if (!currentWallet) return;
            navigator.clipboard.writeText(currentWallet.address).then(() => {
                const copyIcon = document.getElementById('copyIcon');
                const checkIcon = document.getElementById('checkIcon');
                copyIcon.classList.add('hidden');
                checkIcon.classList.remove('hidden');
                setTimeout(() => {
                    copyIcon.classList.remove('hidden');
                    checkIcon.classList.add('hidden');
                }, 1500);
            }).catch(err => {
                console.error('Error al copiar la dirección:', err);
                statusEl.textContent = 'No se pudo copiar la dirección.';
            });
        }

        // --- Event Listeners ---
        closeNotification.addEventListener('click', (e) => {
            e.stopPropagation(); // Evitar que el clic se propague al banner
            hideNotification();
        });

        createWalletButton.addEventListener('click', async () => {
            statusEl.textContent = "Creando billetera aleatoria...";
            createWalletButton.disabled = true;
            createWalletButton.textContent = "Creando...";
            privateKeyEl.textContent = '';
            // Crear una nueva billetera aleatoria con ethers
            const randomWallet = Wallet.createRandom();
            // Guardar la clave privada en el almacenamiento local para persistencia
            localStorage.setItem(WALLET_STORAGE_KEY, randomWallet.privateKey);
            await initializeWalletAndXmtp(randomWallet, true);
        });

        forgetWalletButton.addEventListener('click', () => {
            localStorage.removeItem(WALLET_STORAGE_KEY);
            resetUI();
            statusEl.textContent = "Billetera olvidada. Puedes crear una nueva.";
        });

        copyAddressButton.addEventListener('click', copyAddress);

        recipientAddressInput.addEventListener('blur', async () => {
            const newRecipient = recipientAddressInput.value.trim();
            if (newRecipient && (!currentConversation || currentConversation.peerAddress !== newRecipient)) {
                await startOrLoadConversation(newRecipient);
            }
        });

        sendMessageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = messageInput.value.trim();

            if (!messageText) {
                statusEl.textContent = "Por favor, introduce un mensaje.";
                return;
            }

            if (!currentConversation) {
                statusEl.textContent = "Primero especifica una dirección de destinatario válida.";
                return;
            }

            try {
                // Enviar el mensaje a través de la conversación actual
                await currentConversation.send(messageText);
                // Añadir el mensaje enviado a nuestra UI inmediatamente
                addMessageToUI({ content: messageText, senderAddress: currentWallet.address }, 'sent');
                messageInput.value = ''; 
            } catch (e) {
                statusEl.textContent = `Error al enviar el mensaje.`;
                console.error(e);
            }
        });

        // --- Carga Inicial ---
        function onPageLoad() {
            const savedPrivateKey = localStorage.getItem(WALLET_STORAGE_KEY);
            if (savedPrivateKey) {
                try {
                    const savedWallet = new Wallet(savedPrivateKey);
                    initializeWalletAndXmtp(savedWallet, false);
                } catch (e) {
                    statusEl.textContent = "No se pudo cargar la billetera. Crea una nueva.";
                    localStorage.removeItem(WALLET_STORAGE_KEY);
                    resetUI();
                }
            } else {
                statusEl.textContent = "Haz clic en el botón para comenzar.";
                resetUI();
            }
        }

        // Ejecutar al cargar la página
        onPageLoad();
    </script>
</body>

</html>
