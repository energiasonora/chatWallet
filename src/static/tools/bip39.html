<style>

  header{margin-bottom:2.5rem; position:relative}

    font:600 .72rem/1 var(--mono); padding:.45rem .6rem; border-radius:6px;

    background:var(--panel); border:1px solid var(--line); border-radius:10px;

  }

  .step .why{color:var(--muted); font-size:.88rem; margin-bottom:1rem; max-width:70ch}
  .why code, .note code{font-family:var(--mono); background:#F1F0EA; padding:.1em .35em; border-radius:4px}

    display:inline-block; font:600 .7rem/1 var(--mono); color:var(--accent);
    border:1px solid var(--accent); border-radius:99px; padding:.3rem .6rem;

  label{display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin:.8rem 0 .3rem}

  input:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px}
  button{
    font:600 .85rem/1 inherit; padding:.65rem 1.1rem; border-radius:7px;
    border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer;

  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .row{display:flex; gap:.6rem; flex-wrap:wrap; margin-top:.9rem}
  .field{margin-top:.8rem}
  .field .k{font:600 .72rem/1.4 var(--mono); color:var(--muted); letter-spacing:.05em}
  .field .val{
    font:.82rem/1.6 var(--mono); word-break:break-all; margin-top:.25rem;
    background:#FCFCFA; border:1px solid var(--line); border-radius:7px; padding:.55rem .7rem;
  }
  .val.empty{color:var(--muted); font-style:italic}
  .words{display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.6rem}

    font:.78rem/1 var(--mono); background:#F1F0EA; border:1px solid var(--line);
    border-radius:6px; padding:.4rem .55rem;

  .valid.bad{display:block; color:var(--bad)}

  .chain{border:1px solid var(--line); border-radius:9px; padding:1rem 1.1rem; background:#FDFDFB}
  .chain h3{font-size:.95rem; margin-bottom:.2rem; display:flex; align-items:center; gap:.45rem}
  .chain.eth h3{color:var(--eth)} .chain.btc h3{color:var(--btc)}
  .chain .sub{font:.75rem var(--mono); color:var(--muted)}
  .pathviz{font:.82rem/1.9 var(--mono); word-break:break-all; margin-top:.5rem}
  .pathviz b{font-weight:700}
  .pathviz .seg-p{color:#6D28D9} .pathviz .seg-c{color:var(--btc)}
  .pathviz .seg-a{color:#0E7490} .pathviz .seg-i{color:var(--bad); text-decoration:underline}
  table{width:100%; border-collapse:collapse; margin-top:.9rem; font:.78rem/1.5 var(--mono)}
  th{font:600 .7rem var(--mono); color:var(--muted); text-align:left; letter-spacing:.05em;
     border-bottom:1px solid var(--line); padding:.45rem .5rem}
  td{border-bottom:1px solid var(--line); padding:.45rem .5rem; word-break:break-all; vertical-align:top}
  td.idx{color:var(--muted); white-space:nowrap}
  .note{font-size:.8rem; color:var(--muted); margin-top:.8rem; max-width:70ch}
  .warn{font-size:.8rem; color:var(--bad); margin-top:2rem; text-align:center}
  .arrow{text-align:center; color:var(--muted); font-size:1.3rem; margin:-.4rem 0 1rem}
  @media (max-width:680px){ .grid2{grid-template-columns:1fr} h1{padding-right:0; margin-top:2.6rem} }
  @media (prefers-reduced-motion:no-preference){
    .step{transition:border-color .2s}
    .step:hover{border-color:#CFCCC2}
  }
</style>
</head>

<div class="arrow">↓</div>

    why5: 'Un wallet n’a pas « une » adresse : il dérive une <strong>séquence</strong> en incrémentant le dernier nombre du chemin. C’est pourquoi la restauration depuis la mnémonique fait réapparaître toutes vos adresses, dans le même ordre, sans en avoir stocké aucune.',
    warn: '⚠ Outil pédagogique. Les clés ne vivent qu’en mémoire et disparaissent à la fermeture. N’entrez jamais une mnémonique gardant de vrais fonds.'
  }
};

let lang = 'es';
const t = key => I18N[lang][key];

function applyLang(newLang){
  lang = newLang;
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  recompute(); // re-render mensajes de validez en el idioma nuevo
}
document.querySelectorAll('.langs button').forEach(b =>
  b.addEventListener('click', () => applyLang(b.dataset.lang))
);

/* ---------------- base58check / bech32 (BTC) ---------------- */
function b58check(versionHex, dataHex){
  const payload = E.concat([versionHex, dataHex]);
  const chk = E.dataSlice(E.sha256(E.sha256(payload)), 0, 4);
  return E.encodeBase58(E.concat([payload, chk]));
}
function hash160(pubHex){
  return E.ripemd160(E.sha256(pubHex));
}
const B32C = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
function b32Polymod(values){
  const GEN = [0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];
  let chk = 1;
  for (const v of values){
    const top = chk >> 25;
    chk = ((chk & 0x1ffffff) << 5) ^ v;
    for (let i = 0; i < 5; i++) if ((top >> i) & 1) chk ^= GEN[i];
  }
  return chk;
}
function b32HrpExpand(hrp){
  const out = [];
  for (const c of hrp) out.push(c.charCodeAt(0) >> 5);
  out.push(0);
  for (const c of hrp) out.push(c.charCodeAt(0) & 31);
  return out;
}
function b32Checksum(hrp, data){
  const values = b32HrpExpand(hrp).concat(data).concat([0,0,0,0,0,0]);
  const mod = b32Polymod(values) ^ 1;
  const out = [];
  for (let p = 0; p < 6; p++) out.push((mod >> (5 * (5 - p))) & 31);
  return out;
}
function convertBits(data, from, to, pad){
  let acc = 0, bits = 0;
  const out = [], maxv = (1 << to) - 1;
  for (const v of data){
    acc = (acc << from) | v; bits += from;
    while (bits >= to){ bits -= to; out.push((acc >> bits) & maxv); }
  }
  if (pad && bits > 0) out.push((acc << (to - bits)) & maxv);
  return out;
}
function bech32Address(hrp, witver, programHex){
  const prog = Array.from(E.getBytes(programHex));
  const data = [witver].concat(convertBits(prog, 8, 5, true));
  const combined = data.concat(b32Checksum(hrp, data));
  return hrp + '1' + combined.map(d => B32C[d]).join('');
}

/* ---------------- pipeline ---------------- */
function setVal(id, text){
  const el = $(id);
  el.textContent = text ?? '—';
  el.classList.toggle('empty', !text);
}
function clearAll(){
  ['outEntropy','outSeed','outMaster','outChain','outFp',
   'ethPath','ethPriv','ethPub','ethAddr',
   'btcPath','btcWif','btcPub','btcLegacy','btcSegwit'].forEach(i => setVal(i, null));
  $('orderBody').innerHTML = '';
}
function renderWords(phrase){
  const box = $('wordsViz');
  box.innerHTML = '';
  phrase.trim().split(/\s+/).filter(Boolean).forEach((w, i) => {
    const s = document.createElement('span');
    const n = document.createElement('i');
    n.textContent = (i + 1) + '.';
    s.appendChild(n);
    s.appendChild(document.createTextNode(w));
    box.appendChild(s);
  });
}

function recompute(){
  const phrase = $('mnemoIn').value.trim().toLowerCase().replace(/\s+/g, ' ');
  const pass = $('passIn').value;
  const v = $('validMsg');
  renderWords(phrase);

  if (!phrase){ v.className = 'valid'; clearAll(); return; }

  let mnemo;
  try{
    mnemo = E.Mnemonic.fromPhrase(phrase, pass);
  }catch(err){
    v.className = 'valid bad';
    v.textContent = t('validBad');
    clearAll();
    return;
  }
  v.className = 'valid ok';
  v.textContent = t('validOk');

  // PASO 1: entropía
  setVal('outEntropy', mnemo.entropy + '  (' + ((E.getBytes(mnemo.entropy).length * 8)) + ' bits)');

  // PASO 2: seed (PBKDF2)
  const seed = mnemo.computeSeed();
  setVal('outSeed', seed);

  // PASO 3: clave maestra BIP32
  const root = E.HDNodeWallet.fromSeed(seed);
  setVal('outMaster', root.privateKey);
  setVal('outChain', root.chainCode);
  setVal('outFp', root.fingerprint);

  // PASO 4: derivación por moneda
  const idx = Math.max(0, Math.min(99, parseInt($('idxIn').value || '0', 10)));

  // — Ethereum: m/44'/60'/0'/0/i
  const ethPath = "m/44'/60'/0'/0/" + idx;
  const ethNode = root.derivePath(ethPath);
  const ethPubU = E.SigningKey.computePublicKey(ethNode.publicKey, false);
  setVal('ethPath', ethPath);
  setVal('ethPriv', ethNode.privateKey);
  setVal('ethPub', ethPubU);
  setVal('ethAddr', ethNode.address);

  // — Bitcoin legacy: m/44'/0'/0'/0/i  +  segwit: m/84'/0'/0'/0/i
  const btcPath44 = "m/44'/0'/0'/0/" + idx;
  const btcPath84 = "m/84'/0'/0'/0/" + idx;
  const btc44 = root.derivePath(btcPath44);
  const btc84 = root.derivePath(btcPath84);
  const wif = b58check('0x80', E.concat([btc44.privateKey, '0x01']));
  const legacy = b58check('0x00', hash160(btc44.publicKey));
  const segwit = bech32Address('bc', 0, hash160(btc84.publicKey));
  setVal('btcPath', btcPath44 + '   ·   ' + btcPath84);
  setVal('btcWif', wif);
  setVal('btcPub', btc44.publicKey);
  setVal('btcLegacy', legacy);
  setVal('btcSegwit', segwit);

  // PASO 5: el orden (índices 0..4)
  const body = $('orderBody');
  body.innerHTML = '';
  for (let i = 0; i < 5; i++){
    const e = root.derivePath("m/44'/60'/0'/0/" + i);
    const b = root.derivePath("m/84'/0'/0'/0/" + i);
    const tr = document.createElement('tr');
    const tdI = document.createElement('td'); tdI.className = 'idx'; tdI.textContent = i;
    const tdE = document.createElement('td'); tdE.textContent = e.address;
    const tdB = document.createElement('td'); tdB.textContent = bech32Address('bc', 0, hash160(b.publicKey));
    if (i === idx){ tr.style.background = '#F5F4EE'; tdI.textContent = i + ' ◀'; }
    tr.append(tdI, tdE, tdB);
    body.appendChild(tr);
  }
}

$('mnemoIn').addEventListener('input', recompute);
$('passIn').addEventListener('input', recompute);
$('idxIn').addEventListener('input', recompute);

function generate(bits){
  const mnemo = E.Mnemonic.fromEntropy(E.randomBytes(bits / 8));
  $('mnemoIn').value = mnemo.phrase;
  recompute();
}
$('btn12').addEventListener('click', () => generate(128));
$('btn24').addEventListener('click', () => generate(256));

/* ---------------- init ---------------- */
applyLang('es');
generate(128);
</script>
