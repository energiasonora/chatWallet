<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firma ECDSA · cómo se recupera la clave pública</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
<style>
  :root{
    --bg:#FAFAF7; --panel:#FFFFFF; --ink:#1A1B22; --muted:#6B6E7B;
    --line:#E4E2DA;
    --r:#2563EB; --s:#B45309; --v:#DC2626; --ok:#15803D; --bad:#DC2626;
    --accent:#4338CA;
    --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box; margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    padding:2rem 1rem 5rem;
  }
  .wrap{max-width:880px; margin:0 auto}
  header{margin-bottom:2.5rem; position:relative}
  h1{font-size:1.7rem; letter-spacing:-.02em; line-height:1.2; padding-right:9rem}
  header p{color:var(--muted); margin-top:.5rem; max-width:60ch}
  .langs{position:absolute; top:0; right:0; display:flex; gap:.3rem}
  .langs button{
    font:600 .72rem/1 var(--mono); padding:.45rem .6rem; border-radius:6px;
    border:1px solid var(--line); background:var(--panel); color:var(--muted); cursor:pointer;
  }
  .langs button.active{border-color:var(--ink); background:var(--ink); color:#fff}
  .step{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:1.4rem 1.5rem; margin-bottom:1.4rem; position:relative;
  }
  .step h2{font-size:1.05rem; margin-bottom:.25rem}
  .step .why{color:var(--muted); font-size:.88rem; margin-bottom:1rem; max-width:65ch}
  .why code, .note code{font-family:var(--mono); background:#F1F0EA; padding:.1em .35em; border-radius:4px}
  .tag{
    display:inline-block; font:600 .7rem/1 var(--mono); color:var(--accent);
    border:1px solid var(--accent); border-radius:99px; padding:.3rem .6rem;
    margin-bottom:.7rem; letter-spacing:.06em;
  }
  label{display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin:.8rem 0 .3rem}
  input[type=text], textarea{
    width:100%; font:.85rem/1.5 var(--mono); padding:.6rem .7rem;
    border:1px solid var(--line); border-radius:7px; background:#FCFCFA; color:var(--ink);
  }
  input:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px}
  button{
    font:600 .85rem/1 inherit; padding:.65rem 1.1rem; border-radius:7px;
    border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer;
  }
  button.secondary{background:transparent; color:var(--ink)}
  button:hover{opacity:.85}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .row{display:flex; gap:.6rem; flex-wrap:wrap; margin-top:.9rem}
  .field{margin-top:.8rem}
  .field .k{font:600 .72rem/1 var(--mono); color:var(--muted); letter-spacing:.05em}
  .field .val{
    font:.82rem/1.6 var(--mono); word-break:break-all; margin-top:.25rem;
    background:#FCFCFA; border:1px solid var(--line); border-radius:7px; padding:.55rem .7rem;
  }
  .val.empty{color:var(--muted); font-style:italic}
  .sigviz{font:.82rem/1.9 var(--mono); word-break:break-all; margin-top:.6rem;
    background:#FCFCFA; border:1px solid var(--line); border-radius:7px; padding:.7rem .8rem}
  .sigviz .pre{color:var(--muted)}
  .sigviz .br{color:var(--r); font-weight:600}
  .sigviz .bs{color:var(--s); font-weight:600}
  .sigviz .bv{color:var(--v); font-weight:700; text-decoration:underline}
  .legend{display:flex; gap:1.2rem; flex-wrap:wrap; margin-top:.6rem; font:.75rem var(--mono)}
  .legend span::before{content:'■ '}
  .legend .lr{color:var(--r)} .legend .ls{color:var(--s)} .legend .lv{color:var(--v)}
  .verdict{margin-top:1rem; padding:.7rem .9rem; border-radius:7px; font-weight:600; font-size:.9rem; display:none}
  .verdict.ok{display:block; background:#F0FDF4; border:1px solid var(--ok); color:var(--ok)}
  .verdict.bad{display:block; background:#FEF2F2; border:1px solid var(--bad); color:var(--bad)}
  .modes{display:flex; gap:1.2rem; margin-top:.4rem; font-size:.85rem; flex-wrap:wrap}
  .modes label{display:flex; align-items:center; gap:.4rem; margin:0; font-weight:500; color:var(--ink); cursor:pointer}
  .note{font-size:.8rem; color:var(--muted); margin-top:.8rem; max-width:68ch}
  .arrow{text-align:center; color:var(--muted); font-size:1.3rem; margin:-.4rem 0 1rem}
  @media (max-width:560px){ h1{padding-right:0; margin-top:2.6rem} }
  @media (prefers-reduced-motion:no-preference){
    .step{transition:border-color .2s}
    .step:hover{border-color:#CFCCC2}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="langs" role="group" aria-label="Language">

<!-- PASO 1 -->
<section class="step">
  <span class="tag" data-i18n="tag1"></span>

  </div>
  <label for="privIn" data-i18n="lblPriv"></label>
  <input type="text" id="privIn" placeholder="0x..." spellcheck="false">

  <div class="field"><div class="k" data-i18n="kPub"></div><div class="val empty" id="outPub">—</div></div>

</section>

<div class="arrow">↓</div>

<!-- PASO 2 -->
<section class="step">
  <span class="tag" data-i18n="tag2"></span>
  <h2 data-i18n="h2_2"></h2>
  <p class="why" data-i18n-html="why2"></p>
  <label for="msgIn" data-i18n="lblMsg"></label>
  <textarea id="msgIn" rows="2" spellcheck="false"></textarea>
  <div class="modes" role="radiogroup" aria-label="Signature mode">

    <label><input type="radio" name="mode" value="raw"> <span data-i18n="modeRaw"></span></label>
  </div>

  <div class="field"><div class="k" data-i18n="kDigest"></div><div class="val empty" id="outDigest">—</div></div>
</section>

<div class="arrow">↓</div>

<!-- PASO 3 -->
<section class="step">
  <span class="tag" data-i18n="tag3"></span>
  <h2 data-i18n="h2_3"></h2>
  <p class="why" data-i18n-html="why3"></p>
  <div class="row"><button id="btnSign" data-i18n="btnSign"></button></div>
  <div class="sigviz" id="sigViz"><span class="pre" data-i18n="sigPlaceholder"></span></div>
  <div class="legend"><span class="lr" data-i18n="legR"></span><span class="ls" data-i18n="legS"></span><span class="lv" data-i18n="legV"></span></div>
  <div class="field"><div class="k">r</div><div class="val empty" id="outR">—</div></div>
  <div class="field"><div class="k">s</div><div class="val empty" id="outS">—</div></div>
  <div class="field"><div class="k">v</div><div class="val empty" id="outV">—</div></div>
</section>

<div class="arrow">↓</div>

<!-- PASO 4 -->
<section class="step">
  <span class="tag" data-i18n="tag4"></span>
  <h2 data-i18n="h2_4"></h2>
  <p class="why" data-i18n-html="why4"></p>
  <div class="row"><button id="btnRecover" class="secondary" data-i18n="btnRecover"></button></div>
  <div class="field"><div class="k" data-i18n="kRecPub"></div><div class="val empty" id="outRecPub">—</div></div>
  <div class="field"><div class="k" data-i18n="kRecAddr"></div><div class="val empty" id="outRecAddr">—</div></div>
  <div class="verdict" id="verdict"></div>
  <p class="note" data-i18n-html="note4"></p>
</section>

</div>

const $ = id => document.getElementById(id);

let lang = 'es';
const t = key => I18N[lang][key];

function applyLang(newLang){
  const prevDefault = I18N[lang].defaultMsg;
  lang = newLang;
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  // si el mensaje sigue siendo el de ejemplo, traducirlo también
  const msg = $('msgIn');
  const defaults = Object.values(I18N).map(d => d.defaultMsg);
  if (!msg.value || msg.value === prevDefault || defaults.includes(msg.value)) {
    msg.value = t('defaultMsg');
  }
  refreshDigest();
  // re-render del veredicto si está visible
  const v = $('verdict');
  if (v.classList.contains('ok'))  v.textContent = t('verdictOk');
  if (v.classList.contains('bad')) v.textContent = t('verdictBad');
}

document.querySelectorAll('.langs button').forEach(b =>
  b.addEventListener('click', () => applyLang(b.dataset.lang))
);

/* ---------------- crypto demo ---------------- */
let wallet = null;
let lastSig = null;      // ethers.Signature
let lastDigest = null;

function setVal(id, text){
  const el = $(id);
  el.textContent = text ?? '—';
  el.classList.toggle('empty', !text);
}

function loadWallet(pk){
  try{
    wallet = new E.Wallet(pk);
  }catch(err){
    alert(t('alertBadKey') + (err.shortMessage || err.message));
    return;
  }
  const pub = wallet.signingKey.publicKey;                  // sin comprimir, 0x04…
  const pubC = E.SigningKey.computePublicKey(pub, true);    // comprimida
  setVal('outPriv', wallet.privateKey);
  setVal('outPub',  pub);
  setVal('outPubC', pubC);
  setVal('outAddr', wallet.address);
  lastSig = null; lastDigest = null;
  $('sigViz').innerHTML = '<span class="pre">' + t('sigPlaceholder') + '</span>';
  ['outR','outS','outV','outRecPub','outRecAddr'].forEach(i => setVal(i, null));
  $('verdict').className = 'verdict';
}

$('btnGen').addEventListener('click', () => {
  const w = E.Wallet.createRandom();
  $('privIn').value = w.privateKey;
  loadWallet(w.privateKey);
});

$('privIn').addEventListener('change', e => {
  if (e.target.value.trim()) loadWallet(e.target.value.trim());
});

function currentMode(){
  return document.querySelector('input[name=mode]:checked').value;
}

function computeDigest(){
  const msg = $('msgIn').value;
  if (currentMode() === 'eip191'){
    const len = E.toUtf8Bytes(msg).length;
    setVal('outPrefixed', '"\\x19Ethereum Signed Message:\\n' + len + t('prefixSuffix'));
    $('prefixRow').style.display = '';
    return E.hashMessage(msg);                 // keccak256 del mensaje con prefijo EIP-191
  } else {
    $('prefixRow').style.display = 'none';
    return E.keccak256(E.toUtf8Bytes(msg));    // keccak256 directo
  }
}

function refreshDigest(){
  setVal('outDigest', computeDigest());
}
$('msgIn').addEventListener('input', refreshDigest);
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', refreshDigest));

async function sign(){
  if (!wallet){ alert(t('alertNeedKey')); return; }
  const digest = computeDigest();
  setVal('outDigest', digest);

  let sig;
  if (currentMode() === 'eip191'){
    const sigHex = await wallet.signMessage($('msgIn').value);
    sig = E.Signature.from(sigHex);
  } else {
    sig = wallet.signingKey.sign(digest);
  }
  lastSig = sig;
  lastDigest = digest;

  const hex = sig.serialized.slice(2); // r(64) + s(64) + v(2)
  $('sigViz').innerHTML =
    '<span class="pre">0x</span>' +
    '<span class="br">' + hex.slice(0,64)   + '</span>' +
    '<span class="bs">' + hex.slice(64,128) + '</span>' +
    '<span class="bv">' + hex.slice(128)    + '</span>';

  setVal('outR', sig.r);
  setVal('outS', sig.s);
  setVal('outV', sig.v + '  (' + t('recId') + ' = ' + sig.yParity + ')');
  ['outRecPub','outRecAddr'].forEach(i => setVal(i, null));
  $('verdict').className = 'verdict';
}
$('btnSign').addEventListener('click', sign);

$('btnRecover').addEventListener('click', () => {
  if (!lastSig){ alert(t('alertNeedSig')); return; }

  // El digest se recalcula del mensaje ACTUAL a propósito:
  // editá el mensaje después de firmar y mirá cómo la recuperación apunta a otra clave.
  const digest = computeDigest();
  setVal('outDigest', digest);

  const recPub  = E.SigningKey.recoverPublicKey(digest, lastSig);
  const recAddr = E.computeAddress(recPub);

  setVal('outRecPub', recPub);
  setVal('outRecAddr', recAddr);

  const v = $('verdict');
  if (wallet && recAddr === wallet.address){
    v.className = 'verdict ok';
    v.textContent = t('verdictOk');
  } else {
    v.className = 'verdict bad';
    v.textContent = t('verdictBad');
  }
});

/* ---------------- init ---------------- */
applyLang('es');
const w0 = E.Wallet.createRandom();
$('privIn').value = w0.privateKey;
loadWallet(w0.privateKey);
refreshDigest();
</script>
