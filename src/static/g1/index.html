<title>Explorador Ğ1 · ChatWallet</title>
<meta name="description" content="Mirá un bloque de la cadena Ğ1 (Duniter v2) en castellano: quién pagó a quién, cuánto y con qué comentario, comprobado contra un nodo de la red.">
<link rel="icon" href="/chatWalletWhite.png">
<!--
  Explorador Ğ1 de ChatWallet. Página autocontenida (se copia tal cual a chatwallet.org/g1/).

  De dónde salen los datos — dos fuentes, a propósito:
    1. El INDEXADOR (duniter-squid, GraphQL): arma el relato legible (transferencias,
       comentarios, nombres de identidad, operaciones y eventos). Es cómodo pero es un
       intermediario: podría mentir o estar atrasado.
    2. Un NODO de la red (JSON-RPC por WebSocket, sin librerías): se le pide el hash del
       bloque y el último bloque finalizado. Si el hash coincide con el del indexador, lo que
       se muestra es de ese bloque de verdad.
  Las dos listas se pueden cambiar en ⚙ (se guardan en este navegador) o por la URL:
    ?bloque=3652720&nodo=wss://…&indexador=https://…/v1/graphql   ·   ?cuenta=g1…
  En una cuenta, el SALDO sale de la cadena (System.Account leído del nodo: clave armada con
  blake2b acá mismo); identidad, dividendo sin cobrar y movimientos, del indexador.
  Cuando corramos un nodo propio (la caja o el Samsung), alcanza con ponerlo primero en
  la lista: ver poc/g1-nodo/README.md.
-->

  async function consultar(query, variables) {

        clearTimeout(to);

  // ── Nodo (JSON-RPC por WebSocket, sin librerías) ────────────────────────────────
  function rpc(url, llamadas) {

    });

          el('div', { cls: 'nota', style: 'margin-top:0' }, [(entra ? t('recibido') : t('enviado')) + ' ']),
          linkCuenta(otro, [otroN ? el('span', { cls: 'nombre', text: otroN + ' ' }) : null, el('span', { cls: 'dir', text: otroN ? otro.slice(0, 10) + '…' : otro })]),
          p.comment && p.comment.remark ? el('div', { cls: 'comentario', text: p.comment.remark }) : null,
          el('div', { cls: 'nota' }, [fecha + ' · ', linkB])
        ]));
      });
    };
    if (d) {
      if (!d.transfers.nodes.length) lista.appendChild(el('p', { cls: 'nota', text: t('sin_mov') }));
      pintarMovs(d.transfers.nodes);
      var vistos = d.transfers.nodes.length;
      if (vistos < d.transfers.totalCount) {
        var mas = el('button', { type: 'button', cls: 'mas', text: t('mas') });
        mas.onclick = async function () {
          mas.disabled = true;
          try {
            var r = (await consultar(Q_CUENTA, { id: dir, n: POR_PAGINA, off: vistos })).data;
            pintarMovs(r.transfers.nodes); vistos += r.transfers.nodes.length;
            if (vistos >= r.transfers.totalCount) mas.remove(); else mas.disabled = false;
          } catch (e) { mas.disabled = false; }
        };
        movs.appendChild(mas);
      }
      movs.appendChild(el('p', { cls: 'nota', text: t('idx_nota') }));
    }
    vista.replaceChildren(cab, ident, movs);

    // Dividendo sin cobrar (solo miembros): mismo cálculo que la billetera de la app.
    if (idty && idty.isMember && idty.firstEligibleUd > 0) {
      try {
        var du = (await consultar(Q_DU, { desde: idty.firstEligibleUd })).data;
        var pend = du.universalDividends.nodes.reduce(function (s, u) { return s + Number(u.amount || 0); }, 0);
        if (mio === turno && pend > 0) { var x = $('duPend'); x.textContent = '+ ' + g1(pend) + ' ' + t('du_pend'); x.classList.remove('hidden'); }
      } catch (e) { }
    }
  }

  // ── Navegación: ?bloque=N o ?cuenta=g1… ─────────────────────────────────────────
  function destinoDeUrl() {
    var q = new URLSearchParams(location.search);
    var c = q.get('cuenta');
    if (c) return { cuenta: c.trim() };
    var v = q.get('bloque') || (location.hash.match(/bloque=(\d+)/) || [])[1];
    var n = Number(v);
    return v && Number.isSafeInteger(n) && n >= 0 ? { bloque: n } : null;
  }
  function abrir(dest) { if (!dest) return; if (dest.cuenta) mostrarCuenta(dest.cuenta); else mostrar(dest.bloque); }
  function ir(dest) {
    var u = new URL(location.href);
    u.searchParams.delete('bloque'); u.searchParams.delete('cuenta');
    if (dest.cuenta) u.searchParams.set('cuenta', dest.cuenta); else u.searchParams.set('bloque', String(dest.bloque));
    history.pushState(null, '', u);
    window.scrollTo(0, 0);
    abrir(dest);
  }
  $('formBuscar').onsubmit = function (e) {
    e.preventDefault();
    var v = String($('inBloque').value).trim();
    if (/^g1/i.test(v)) { ir({ cuenta: v }); return; }
    var n = Number(v.replace(/[.\s,]/g, ''));
    if (!Number.isSafeInteger(n) || n < 0) return;
    ir({ bloque: n });
  };
  window.addEventListener('popstate', function () { abrir(destinoDeUrl()); });
  abrir(destinoDeUrl());
})();
</script>
