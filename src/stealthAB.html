     import { Client } from '@xmtp/browser-sdk';

    };

    // --- CORE CRYPTO LOGIC (The Fixed Math) ---
    
    // Generates a stealth address using the "Scalar Addition" method for robustness in JS.
    // WARNING: In a real "Blind" scenario, the sender computes using EC Point Addition (Pub + G*s).
    // Because implementing EC Point addition in vanilla Ethers v6 is tricky without extra libs,
    // and because this is a Local Test UI where we have both keys in 'state',
    // we will simulate the correct derivation using the Receiver's Private Key Scalar to ensure 
    // the address matches what the receiver will derive.
    // This guarantees the demo works while respecting the math: 
    // StealthPriv = (ReceiverPriv + Hash(SharedSecret)) % Order
    async function getStealthDetails(senderWallet, receiverPubKey, receiverPrivKey, index = 0) {
        // 1. Generate Ephemeral Key (usually random, here we derive from sender for determinism in demo)
        // In prod: const ephemeral = ethers.Wallet.createRandom();
        const ephemeral = senderWallet; 
        
        // 2. ECDH Shared Secret
        const sharedSecret = ephemeral.signingKey.computeSharedSecret(receiverPubKey);
        
        // 3. Hash the secret with an index (to generate multiple addresses from one secret)
        const secretHash = ethers.keccak256(ethers.concat([
            ethers.getBytes(sharedSecret),
            ethers.toBeHex(index, 32)
        ]));
        
        // 4. SCALAR ADDITION (The reliable way in JS)
        // Stealth Private Key = (Receiver Private Scalar + Hash Scalar) % Curve Order
        const receiverScalar = BigInt(receiverPrivKey);
        const hashScalar = BigInt(secretHash);
        const stealthScalar = (receiverScalar + hashScalar) % CONFIG.curveOrder;
        
        const stealthPrivKey = "0x" + stealthScalar.toString(16).padStart(64, '0');
        const stealthWallet = new ethers.Wallet(stealthPrivKey, senderWallet.provider);
        
        return {
            stealthWallet,
            sharedSecret,
            index
        };
    }

            state[user].wallet = wallet;

            // wallet.signingKey.publicKey

            log(user, `Wallet Ready: ${wallet.address}`, "success");
            // log(user, `inboxId : ${xmtp.inboxId}`, "success");
// chatwalletxmtp.inboxId

            initXMTP(user);

    async function initXMTP(user) {
        log(user, "Connecting to XMTP network...", "info");
        us=user;
        const wallet = state[user].wallet;
        const userAddress = wallet.address;
        try {
            // Create a signer object compatible with the XMTP Browser SDK
            const walletSigner = {
                type: "EOA",
                getIdentifier: () => ({ identifier: userAddress, identifierKind: "Ethereum" }),
                signMessage: async (message) => ethers.getBytes(await wallet.signMessage(message)),
            };
            ws= walletSigner;

            const xmtp = await Client.create(walletSigner, { env: "dev" });
            xxmtp = xmtp;
            state[user].xmtp = xmtp;
            log(user, `XMTP Client Active (Dev Network) for InboxID: ${xmtp.inboxId.substring(0, 10)}...`, "success");
            log(user, `inboxId : ${xmtp.inboxId}`, "success");

            // Start listening for messages now that the client is ready.
            listenForIncomingMessages(user);
        } catch (e) {
            xx=e
            log(user, `XMTP Init Error!!: ${e.message}`, "error");
            
          
                // 1. Convert error to string just in case
                const errorMessage = e.message || e.toString();
                
                // 2. Define Regex
                // Looks for the literal text "InboxID" followed by a space
                // Then captures a sequence of hexadecimal characters (0-9, a-f)
                const regex = /InboxID\s+([a-fA-F0-9]+)/;
                
                // 3. Execute match
                const match = errorMessage.match(regex);

                if (match && match[1]) {
                    const caughtInboxId = match[1];
                    
                    console.warn("Successfully caught InboxID:", caughtInboxId);
                    
                    // Now you can trigger your revocation logic with caughtInboxId
                    // handleRevoke(caughtInboxId);
                    const revokeBtn = document.getElementById(`${user}-revoke-btn`);
                    if (revokeBtn) {
                        revokeBtn.onclick = () => revokeXmtpInstallations(user, caughtInboxId);
                    }
                    if(revokeBtn) revokeBtn.classList.remove('hidden');
                    log(user, "XMTP installation error detected. Revoke button is now available.", "warn");
                    
                } else {
                    console.error("Could not parse InboxID from error:", errorMessage);
                }

// 
        }
    }

            async function listenForIncomingMessages(user) {
        if (!state[user].xmtp || state[user].keyListenerActive) {
            log(user, "XMTP client not ready or listener already active.", "warn");
            return;
        }

        log(user, "Activating message listener...", "info");
        state[user].keyListenerActive = true;

        try {

            const stream = await state[user].xmtp.conversations.streamAllMessages()

            // const stream = await state[user].xmtp.conversations.streamAllMessages(
            //     {

            //         onValue: async (message) => {
            //             console.log('mensajito:', message)
            //         },
            //         onError: (error) => console.error("Error en stream de mensajes:", error)
            //     }
            // );
            

            for await (const message of stream) {
                console.log(user, 'mensajin:',message )
                xm = message
                // Ensure our own wallet is initialized before trying to access its properties
                if (!state[user].wallet) continue;

                // const isSentByMe = message.senderAddress.toLowerCase() === state[user].wallet.address.toLowerCase();
                    const isSentByMe = message.senderInboxId === state[user].xmtp.inboxId;

                // message.senderInboxId

                // In this demo, we are primarily interested in messages from the other user.
                if (isSentByMe) {
                    continue;
                }

                // const senderAddress = message.senderAddress.toLowerCase();
                const senderAddress = (await state[user].xmtp.preferences.inboxStateFromInboxIds([message.senderInboxId], true))[0].identifiers[0].identifier;

                const content = message.content;
                const peerUser = (user === 'alice') ? 'bob' : 'alice';
                const peerAddress = state[peerUser].wallet ? state[peerUser].wallet.address.toLowerCase() : undefined;

                // Only process messages from the known peer in this demo
                if (!peerAddress || senderAddress !== peerAddress) continue;

                if (typeof content === 'string' && content.startsWith("PUBKEY:0x")) {
                    const extractedKey = content.split(":")[1];
                    if (state[user].peerPubKeys[peerUser] !== extractedKey) {
                        state[user].peerPubKeys[peerUser] = extractedKey;
                        document.getElementById(`${user}-sync-status`).className = "fa-solid fa-circle-check text-green-500";
                        document.getElementById(`${user}-sync-status`).title = `Synced with ${peerUser}`;
                        log(user, `Synced! Received Public Key from ${peerUser}`, "success");
                    }
                } else {
                    log(user, `<i class="fa-solid fa-comment-dots"></i> <b>Msg from ${peerUser}:</b> ${content}`, "info");
                }
            }
        } catch (e) {
            log(user, `Message stream error: ${e.message}`, "error");
            state[user].keyListenerActive = false; // Allow restart
        }
    }

    // --- ACTIONS ---

    window.hardSync = async (user, targetUser) => {
        if (!state[user].xmtp) return log(user, "XMTP not ready", "error");

        const targetAddress = state[targetUser].wallet?.address;
            console.log('targetAddress:',targetAddress )

        if (!targetAddress) return log(user, `Target ${targetUser} not initialized locally`, "error");

        log(user, `Sending public key to ${targetAddress}...`, "info");

        try {
            const conversation = await state[user].xmtp.conversations.newDmWithIdentifier({
                identifier: targetAddress, identifierKind: "Ethereum"
            });

            const myPubKey = state[user].wallet.signingKey.publicKey;
            // const myPubKey = state[user].wallet.publicKey;
            // signingKey.publicKey
            console.log('SENDING PUKBEY:',myPubKey )
            // console.log('SENDING PUKBEY?:',state[user].wallet?.publicKey )
            await conversation.send(`PUBKEY:${myPubKey}`);

    /**
     * Permite enviar un mensaje de texto a través de XMTP desde la consola para pruebas.
     * @param {string} fromUser - El usuario que envía ('alice' o 'bob').
     * @param {string} toAddress - La dirección de Ethereum del destinatario.
     * @param {string} message - El contenido del mensaje a enviar.
     */
    window.sendMessage = async (fromUser, toAddress, message) => {
        if (!['alice', 'bob'].includes(fromUser)) {
            return console.error("Usuario inválido. Debe ser 'alice' o 'bob'.");
        }
        if (!state[fromUser]?.xmtp) {
            log(fromUser, "El cliente XMTP del remitente no está listo.", "error");
            return;
        }
        if (!toAddress || !message) {
            log(fromUser, "Se requiere la dirección del destinatario y un mensaje.", "error");
            return;
        }

        log(fromUser, `Enviando mensaje a ${toAddress.substring(0, 6)}...`, "info");
        try {
            const conversation = await state[fromUser].xmtp.conversations.newDmWithIdentifier({ identifier: toAddress, identifierKind: "Ethereum" });
            await conversation.send(message);
            log(fromUser, `Mensaje enviado: "${message}"`, "success");

            log(fromUser, "Fallo en el envío del mensaje: " + e.message, "error");

    /**
     * Revokes all existing XMTP installations for a user.

    window.revokeXmtpInstallations = async (user, inboxIdToRevoke) => {

        const wallet = state[user]?.wallet;
        if (!wallet) {
            return log(user, "Wallet not initialized. Can't revoke installations.", "error");
        }

        log(user, "Attempting to revoke old XMTP installations...", "warn");

        try {
            // The SDK's static methods require a signer object.
            const walletSigner = {
                type: "EOA",
                getIdentifier: () => ({ identifier: wallet.address, identifierKind: "Ethereum" }),
                signMessage: async (message) => ethers.getBytes(await wallet.signMessage(message)),
            };

            xws=walletSigner

            }

            log(user, `Fetching installations for InboxID: ${inboxIdToRevoke.substring(0,10)}...`, "info");

            let inboxStates = await Client.inboxStateFromInboxIds([inboxIdToRevoke], "dev");
            ibs = inboxStates;

            if (!inboxStates || !inboxStates[0] || inboxStates[0].installations.length === 0) {
                return log(user, "No installations found to revoke.", "info");
            }
            
            console.log('installation length:', inboxStates[0].installations.length);

            let toRevoke = inboxStates[0].installations.map((i) => i.bytes);
            tr = toRevoke;
            console.log('toRevokeInstallationBytes:', toRevoke);

            log(user, `Found ${toRevoke.length} installations to revoke.`, "info");

            if (toRevoke.length === 0) {
                return log(user, "Only one installation exists. Nothing to revoke.", "info");

            // 4. Revoke the selected installations using the static method.
            await Client.revokeInstallations(walletSigner, inboxIdToRevoke, toRevoke);

            // await Client.revokeInstallations(
            //     walletSigner,
            //     inboxIdToRevoke,
            //     toRevoke,
            // );
            log(user, `✅ Successfully revoked ${toRevoke.length} installation(s). You can now 'Init Wallet' again.`, "success");
        } catch (e) {
            log(user, `Failed to revoke installations: ${e.message}`, "error");
        }
    };

    window.sendStealthTransaction = async (sender, recipient) => {
        const sState = state[sender];
        const rState = state[recipient];

        if (!sState.wallet) return log(sender, "Init wallet first", "error");
        // PRIMADO NEGATIVO: We need the recipient's public key to generate the shared secret
        if (!sState.peerPubKeys[recipient]) return log(sender, "Need Recipient PubKey. Do Hard Sync first.", "error");

        const amount = document.getElementById(`${sender}Amount`).value;
        log(sender, `Generating stealth address for ${amount} ETH...`, "info");

        try {
            // NOTE: passing rState.wallet.privateKey is the "simulation" cheat mentioned earlier
            // to guarantee the math matches in this specific JS environment.
            const { stealthWallet, index } = await getStealthDetails(
                sState.wallet, 
                sState.peerPubKeys[recipient],
                rState.wallet.privateKey
            );

            log(sender, `Stealth Addr Generated: ${stealthWallet.address}`, "info");

            const tx = await sState.wallet.sendTransaction({
                to: stealthWallet.address,
                value: ethers.parseEther(amount)

            const explorerUrl = `https://sepolia.arbiscan.io/tx/${tx.hash}`;

    window.scanAndSweep = async (user, senderName) => {
        const uState = state[user];
        const senderPubKey = uState.peerPubKeys[senderName]; // Need sender pubkey to derive shared secret

        if (!uState.wallet) return log(user, "Init wallet first", "error");
        // To scan, we need to know who sent it (to derive shared secret) or brute force check against known contacts
        if (!senderPubKey) return log(user, `Need ${senderName}'s PubKey to calculate shared secret`, "error");

        log(user, "Scanning blockchain for stealth funds...", "warn");

        try {
            // In a real implementation, sender calculates address using Ephemeral Key.
            // Here, sender used their Main Key as Ephemeral.
            
            let totalFoundBalance = 0n;
            const walletsToSweep = [];

            // --- SCANNING PHASE ---
            for(let i=0; i<5; i++) {
                // Derive the stealth wallet for this index
                const sharedSecret = uState.wallet.signingKey.computeSharedSecret(senderPubKey);
                const secretHash = ethers.keccak256(ethers.concat([
                    ethers.getBytes(sharedSecret),
                    ethers.toBeHex(i, 32)
                ]));
                const myScalar = BigInt(uState.wallet.privateKey);
                const hashScalar = BigInt(secretHash);
                const stealthScalar = (myScalar + hashScalar) % CONFIG.curveOrder;
                const stealthPrivKey = "0x" + stealthScalar.toString(16).padStart(64, '0');
                const stealthWallet = new ethers.Wallet(stealthPrivKey, uState.wallet.provider);

                const balance = await uState.wallet.provider.getBalance(stealthWallet.address);
                const fmtBal = ethers.formatEther(balance);
                log(user, `Checking index ${i}: ${stealthWallet.address.substring(0,8)}... | Bal: ${fmtBal} ETH`, "info");

                if (balance > 0n) {
                    log(user, `FUNDS FOUND! ${fmtBal} ETH @ Index ${i}`, "success");
                    totalFoundBalance += balance;
                    walletsToSweep.push({ wallet: stealthWallet, balance: balance, index: i });
                }
            }

            // --- SWEEPING PHASE ---
            if (totalFoundBalance > 0n) {
                log(user, `<b>Total Found: ${ethers.formatEther(totalFoundBalance)} ETH across ${walletsToSweep.length} address(es).</b>`, "success");
                log(user, "Beginning sweep process...", "warn");

                for (const item of walletsToSweep) {
                    const { wallet: stealthWallet, balance, index } = item;
                    const fmtBal = ethers.formatEther(balance);
                    log(user, `Sweeping index ${index} (${fmtBal} ETH)...`, "info");

                    try {
                        const feeData = await uState.wallet.provider.getFeeData();
                        const gasLimit = 21000n;
                        const gasCost = feeData.maxFeePerGas * gasLimit;

                        if (balance <= gasCost) {
                            log(user, `Balance at index ${index} is too low to cover gas. Skipping.`, "error");
                            continue;
                        }

                        const amountToSend = balance - gasCost;
                        const tx = await stealthWallet.sendTransaction({
                            to: uState.wallet.address,
                            value: amountToSend,
                            gasLimit: gasLimit,
                            maxFeePerGas: feeData.maxFeePerGas,
                            maxPriorityFeePerGas: feeData.maxPriorityFeePerGas
                        });

                        const explorerUrl = `https://sepolia.arbiscan.io/tx/${tx.hash}`;
                        log(user, `Sweep from index ${index} complete! Tx: <a href="${explorerUrl}" target="_blank" class="text-cyan-400 hover:underline">${tx.hash.substring(0,10)}...</a>`, "success");

                    } catch (sweepError) {
                        log(user, `Error sweeping index ${index}: ${sweepError.message}`, "error");
                    }
                }

                // Final balance update after all sweeps
                setTimeout(async () => {
                    const mainBal = await uState.wallet.provider.getBalance(uState.wallet.address);
                    document.getElementById(`${user}-bal`).innerText = ethers.formatEther(mainBal) + " ETH";
                    log(user, "All sweeps processed. Main balance updated.", "success");
                }, 5000);

            } else {
                log(user, "Scan complete. No funds found in the first 5 indexes.", "info");
            }

        } catch (e) {
            log(user, "Scan Error: " + e.message, "error");
        }
    };

  </script>
