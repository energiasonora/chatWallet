<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sora', sans-serif;
        }
        /* Style for the modal backdrop */
        .modal-backdrop {
            background-color: rgba(10, 10, 20, 0.5);
            backdrop-filter: blur(5px);
        }
        /* Transitions for all elements */
        .modal, body, .bg-white, .bg-gray-100, .text-gray-800, .text-gray-700, .border-gray-300, #notification {
            transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out, border-color 0.3s ease-in-out, opacity 0.3s ease-in-out, transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        /* Glow animation */
        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 15px rgba(59, 130, 246, 0.4), 0 0 5px rgba(59, 130, 246, 0.6);
            }
            50% {
                box-shadow: 0 0 25px rgba(59, 130, 246, 0.7), 0 0 10px rgba(59, 130, 246, 0.9);
            }
        }

        .btn-glow {
            animation: pulse-glow 2.5s infinite ease-in-out;
        }
        
        .timer-glow {
             text-shadow: 0 0 8px rgba(59, 130, 246, 0.7);
        }

        .dark .timer-glow {
            text-shadow: 0 0 8px rgba(96, 165, 250, 0.7);
        }

    </style>
    <script>
        // Set theme on initial load
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 flex items-center justify-center h-screen">

    <!-- Theme Toggle Button -->
    <div class="absolute top-4 right-4">
        <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-2.5">
            <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
            <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
        </button>
    </div>

    <!-- Main container for connection options -->
    <div class="text-center">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200 mb-6">Connect your Wallet</h1>
        <div class="space-y-4">
             <button class="w-64 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 font-semibold py-3 px-4 rounded-lg shadow-sm hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center justify-center">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/MetaMask_Fox.svg" alt="MetaMask" class="w-6 h-6 mr-3">
                Connect with MetaMask
            </button>
            <button id="chatwallet-btn" class="w-64 bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:bg-blue-700 focus:outline-none btn-glow flex items-center justify-center">
                 <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                Connect with ChatWallet
            </button>
        </div>
    </div>

    <!-- Modal for ChatWallet Connection -->
    <div id="chatwallet-modal" class="modal fixed inset-0 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none">
        <!-- Modal Backdrop -->
        <div class="modal-backdrop absolute inset-0"></div>

        <!-- Modal Content -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-sm mx-auto z-10 transform scale-95 shadow-[0_0_20px_rgba(59,130,246,0.2)] dark:shadow-[0_0_25px_rgba(96,165,250,0.2)]">
            <div class="p-6 text-center relative">
                <!-- Close Button -->
                <button id="close-modal-btn" class="absolute top-4 right-4 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>

                <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-4">Connect with ChatWallet</h2>
                
                <!-- QR Code -->
                <div class="my-6">
                    <img src="https://placehold.co/200x200/3B82F6/FFFFFF?text=Scan+Me" alt="QR Code for wallet connection" class="mx-auto rounded-lg shadow-md">
                </div>

                <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">
                    To login to the app, please sign this message with your wallet.
                </p>

                <!-- Unique ID Section -->
                <div class="bg-gray-100 dark:bg-gray-700 rounded-lg p-3 flex items-center justify-between">
                    <p class="text-xs text-gray-500 dark:text-gray-300 mr-2">Unique ID: <span id="unique-id" class="font-mono text-gray-800 dark:text-gray-100">6977516c-a7ed-4deb-97d7-7196c8f63f0f</span></p>
                    <button id="copy-id-btn" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400" title="Copy ID">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </button>
                </div>
                 <div id="copy-feedback" class="text-sm text-green-600 mt-2 h-5 opacity-0 transition-opacity duration-300">Copied to clipboard!</div>


                <!-- Timer -->
                <div class="mt-6 text-sm text-gray-500 dark:text-gray-400">
                    Time remaining: <span id="timer" class="font-semibold text-blue-600 dark:text-blue-400 timer-glow">15:00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="fixed top-5 right-5 z-[100] p-4 rounded-lg shadow-lg text-white opacity-0 -translate-y-12 pointer-events-none">
        <span id="notification-message"></span>
    </div>

    <script>
        // --- DOM Elements ---
        const chatWalletBtn = document.getElementById('chatwallet-btn');
        const modal = document.getElementById('chatwallet-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const copyIdBtn = document.getElementById('copy-id-btn');
        const uniqueIdEl = document.getElementById('unique-id');
        const timerEl = document.getElementById('timer');
        const copyFeedbackEl = document.getElementById('copy-feedback');
        const themeToggleButton = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
        const notification = document.getElementById('notification');
        const notificationMessage = document.getElementById('notification-message');

        let timerInterval;
        let notificationTimeout;

        // --- Theme Management ---
        const toggleThemeIcons = () => {
            if (document.documentElement.classList.contains('dark')) {
                themeToggleLightIcon.classList.remove('hidden');
                themeToggleDarkIcon.classList.add('hidden');
            } else {
                themeToggleLightIcon.classList.add('hidden');
                themeToggleDarkIcon.classList.remove('hidden');
            }
        };
        toggleThemeIcons();
        themeToggleButton.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            toggleThemeIcons();
        });

        // --- Notification ---
        /**
         * Shows a notification message.
         * @param {string} message - The message to display.
         * @param {string} type - The type of notification ('success' or 'error').
         */
        function showNotification(message, type = 'success') {
            clearTimeout(notificationTimeout); // Clear previous timeout if any
            
            notificationMessage.textContent = message;
            notification.classList.remove('bg-green-500', 'bg-red-500', 'opacity-0', '-translate-y-12');
            notification.style.boxShadow = ''; // Clear previous glow
            
            if (type === 'success') {
                notification.classList.add('bg-green-500');
                notification.style.boxShadow = '0 0 15px rgba(34, 197, 94, 0.5)';
            } else {
                notification.classList.add('bg-red-500');
                notification.style.boxShadow = '0 0 15px rgba(239, 68, 68, 0.5)';
            }

            notificationTimeout = setTimeout(() => {
                notification.classList.add('opacity-0', '-translate-y-12');
            }, 3000); // Hide after 3 seconds
        }

        // --- Modal & Wallet Functions ---
        /**
         * Opens the modal, starts the timer, and simulates a connection.
         */
        function openModal() {
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('.z-10').classList.remove('scale-95');
            startTimer(15 * 60); // 15 minutes in seconds

            // Simulate a successful connection after 3 seconds
            setTimeout(() => {
                // Only show success if the modal is still open (i.e., not timed out or closed by user)
                if (!modal.classList.contains('pointer-events-none')) {
                    closeModal();
                    showNotification('Connection successful!', 'success');
                }
            }, 3000);
        }

        /**
         * Closes the modal and clears the timer.
         */
        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('.z-10').classList.add('scale-95');
            clearInterval(timerInterval);
        }

        /**
         * Starts the countdown timer.
         * @param {number} duration - The duration of the timer in seconds.
         */
        function startTimer(duration) {
            let timer = duration;
            clearInterval(timerInterval); // Clear any existing timer
            timerInterval = setInterval(() => {
                const minutes = String(Math.floor(timer / 60)).padStart(2, '0');
                const seconds = String(timer % 60).padStart(2, '0');
                timerEl.textContent = `${minutes}:${seconds}`;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    timerEl.textContent = "Expired";
                    closeModal();
                    showNotification('Connection timed out. Please try again.', 'error');
                }
            }, 1000);
        }

        /**
         * Copies the unique ID to the clipboard.
         */
        function copyIdToClipboard() {
            const idToCopy = uniqueIdEl.textContent;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(idToCopy).then(showCopyFeedback).catch(err => {
                    console.error('Failed to copy text: ', err);
                    fallbackCopyTextToClipboard(idToCopy);
                });
            } else {
                fallbackCopyTextToClipboard(idToCopy);
            }
        }
        
        /**
         * Fallback method for copying text to clipboard.
         * @param {string} text - The text to copy.
         */
        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                if (document.execCommand('copy')) showCopyFeedback();
            } catch (err) {
                console.error('Fallback: Unable to copy', err);
            }
            document.body.removeChild(textArea);
        }
        
        /**
         * Shows a "Copied!" feedback message.
         */
        function showCopyFeedback() {
            copyFeedbackEl.classList.remove('opacity-0');
            setTimeout(() => {
                copyFeedbackEl.classList.add('opacity-0');
            }, 2000);
        }

        // --- Event Listeners ---
        chatWalletBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        copyIdBtn.addEventListener('click', copyIdToClipboard);
        modal.addEventListener('click', (event) => {
            if (event.target === modal) closeModal();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !modal.classList.contains('pointer-events-none')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
