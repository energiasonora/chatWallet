<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel · libro en junas</title>
<style>
  :root { --tinta:#0a0a0a; --papel:#fff; --gris:#6b6b6b; --linea:#e4e4e4; --acento:#2b9de3; --suave:#f4f4f4; --ok:#1f8a4c; --ok-s:#e6f5ec; --no:#9a3b1e; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--tinta); background: var(--papel); line-height: 1.45; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.15rem; margin: 0 0 14px; }
  h2 { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--gris); margin: 22px 0 8px; }
  input { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--linea); border-radius: 10px; }
  label { display: block; font-size: .85rem; color: var(--gris); margin: 10px 0 4px; }
  button { font: inherit; cursor: pointer; }
  .btn { border: 0; border-radius: 999px; padding: 11px 16px; background: var(--tinta); color: #fff; font-weight: 600; }
  .btn.sec { background: #fff; color: var(--tinta); border: 1px solid var(--tinta); font-weight: 500; }
  .btn.chico { padding: 6px 12px; font-size: .85rem; }
  .interruptor { width: 100%; border: 0; border-radius: 16px; padding: 22px 16px; font-size: 1.25rem; font-weight: 700; }
  .interruptor.abierta { background: var(--ok); color: #fff; }
  .interruptor.cerrada { background: var(--suave); color: var(--tinta); border: 2px dashed #bbb; }
  .interruptor small { display: block; font-weight: 400; font-size: .85rem; opacity: .85; margin-top: 4px; }
  .fila { display: flex; gap: 10px; align-items: end; }
  .fila > div { flex: 1; }
  .info { font-size: .85rem; margin: 6px 0 0; color: var(--gris); }
  .info.mal { color: var(--no); }
  .pedido { border: 1px solid var(--linea); border-radius: 12px; padding: 10px 12px; margin: 0 0 8px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .pedido.pago { background: var(--ok-s); border-color: #cfe9d8; }
  .pedido code { font-size: 1.05rem; font-weight: 700; letter-spacing: .04em; }
  .pedido .meta { grid-column: 1 / -1; font-size: .8rem; color: var(--gris); overflow-wrap: anywhere; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal > div { background: #fff; border-radius: 16px; padding: 18px; width: 100%; max-width: 360px; text-align: center; }
  .modal .qr svg { width: 100%; height: auto; display: block; }
  .err { color: var(--no); font-size: .9rem; }
  a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Libro en junas · panel</h1>

  <section id="login" hidden>
    <label for="token">Token del panel (el mismo de book-admin)</label>
    <input id="token" type="password" autocomplete="off">
    <p><button class="btn" id="entrar" type="button">Entrar</button></p>
    <p class="err" id="loginErr"></p>
  </section>

  <section id="panel" hidden>
    <button class="interruptor cerrada" id="interruptor" type="button">…</button>
    <p class="info" style="text-align:center"><a href="/" target="_blank" rel="noopener">Abrir la página de venta ↗</a> · libro.chatwallet.org</p>

    <h2>Precio y cuenta</h2>
    <div class="fila">
      <div><label for="precio">Precio (Ğ1)</label><input id="precio" inputmode="decimal"></div>
      <div style="flex:2"><label for="cuenta">Cuenta que cobra (g1…)</label><input id="cuenta" autocomplete="off" spellcheck="false"></div>
    </div>
    <p class="info" id="cuentaInfo"></p>
    <p><button class="btn sec chico" id="guardar" type="button">Guardar</button> <span class="info" id="guardado"></span></p>

    <h2>Pedidos <span id="cuantos"></span></h2>
    <div id="pedidos"></div>
    <p class="info">Si el comprador no puso el comentario o la cadena no responde: mirá el pago en tu billetera y tocá «Marcar pagado».</p>
    <p class="err" id="panelErr"></p>
    <p class="info"><button class="btn sec chico" id="salir" type="button">Salir</button></p>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div>
    <p style="margin:0 0 8px"><b id="mTitulo"></b></p>
    <div class="qr" id="mQr"></div>
    <p class="info" id="mNota">Que el comprador escanee este QR para bajar el PDF.</p>
    <p><button class="btn chico" id="mCerrar" type="button">Cerrar</button></p>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const CLAVE = 'libro-admin-token';
  let datos = null, timer = null;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const g1 = (c) => (c / 100).toLocaleString('es-AR', { maximumFractionDigits: 2 });
  const hace = (ms) => {
    const m = Math.round((Date.now() - ms) / 60000);
    if (m < 1) return 'recién';
    if (m < 60) return `hace ${m} min`;
    const h = Math.round(m / 60);
    if (h < 24) return `hace ${h} h`;
    return new Date(ms).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
  };

  async function api(path, body) {
    const r = await fetch(path, {
      method: body ? 'POST' : 'GET', cache: 'no-store',
      headers: { Authorization: 'Bearer ' + localStorage.getItem(CLAVE), ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error || r.status); e.status = r.status; throw e; }
    return j;
  }

  function pintar(d, { campos = false } = {}) {
    datos = d;
    const sw = $('interruptor');
    sw.className = 'interruptor ' + (d.activo ? 'abierta' : 'cerrada');
    sw.innerHTML = d.activo
      ? 'Venta ABIERTA<small>Tocá para cerrarla</small>'
      : 'Venta CERRADA<small>Tocá para abrirla</small>';
    if (campos) { $('precio').value = String(d.centimos / 100); $('cuenta').value = d.cuenta || ''; }
    const ci = $('cuentaInfo');
    ci.className = 'info';
    if (!d.cuenta) { ci.textContent = 'Falta la cuenta: sin ella no se puede abrir la venta.'; ci.className = 'info mal'; }
    else if (d.cuentaExiste === false) { ci.textContent = '⚠ Esa cuenta no aparece en la cadena (nunca recibió nada). Revisala antes de abrir.'; ci.className = 'info mal'; }
    else if (d.cuentaExiste) ci.textContent = d.cuentaNombre ? `✓ Cuenta de ${d.cuentaNombre} (identidad Ğ1)` : '✓ La cuenta existe en la cadena (sin identidad de miembro)';
    else ci.textContent = 'No pude consultar la cadena para revisar la cuenta.';

    const pagos = d.pedidos.filter((p) => p.pagado);
    $('cuantos').textContent = `· ${pagos.length} ${pagos.length === 1 ? 'pagado' : 'pagados'} · ${g1(pagos.reduce((s, p) => s + (p.recibido || p.centimos), 0))} Ğ1`;
    $('pedidos').innerHTML = d.pedidos.length ? d.pedidos.map((p) => `
      <div class="pedido ${p.pagado ? 'pago' : ''}">
        <code>${esc(p.codigo)}</code>
        ${p.pagado
          ? `<button class="btn sec chico" type="button" data-qr="${esc(p.codigo)}">QR descarga</button>`
          : `<button class="btn chico" type="button" data-pagar="${esc(p.codigo)}">Marcar pagado</button>`}
        <div class="meta">${esc(p.lang === 'fr' ? 'FR' : 'ES')} · ${g1(p.centimos)} Ğ1 · ${hace(p.creado)} ·
          ${p.pagado
            ? `✓ pagado ${hace(p.pagado)} (${p.via === 'manual' ? 'a mano' : 'cadena'})${p.desde ? ' · de ' + esc(p.desde.slice(0, 8)) + '…' : ''} · ${p.descargas ?? 0} descargas`
            : (p.recibido ? `llegaron ${g1(p.recibido)} Ğ1 (parcial)` : 'esperando el pago')}</div>
      </div>`).join('') : '<p class="info">Todavía no hay pedidos.</p>';
  }

  async function cargar(campos) {
    clearTimeout(timer);
    try {
      pintar(await api('/admin/g1'), { campos });
      $('panelErr').textContent = '';
    } catch (e) {
      if (e.status === 401) return salir('Token incorrecto.');
      $('panelErr').textContent = 'Sin conexión con el servidor: ' + e.message;
    }
    timer = setTimeout(() => cargar(false), 15000);
  }

  function salir(msg) {
    clearTimeout(timer);
    localStorage.removeItem(CLAVE);
    $('panel').hidden = true; $('login').hidden = false;
    $('loginErr').textContent = msg || '';
  }

  function entrar() {
    $('login').hidden = true; $('panel').hidden = false;
    cargar(true);
  }

  $('entrar').addEventListener('click', () => {
    const v = $('token').value.trim();
    if (!v) return;
    localStorage.setItem(CLAVE, v);
    $('token').value = '';
    entrar();
  });
  $('salir').addEventListener('click', () => salir());

  $('interruptor').addEventListener('click', async () => {
    if (!datos) return;
    $('interruptor').disabled = true;
    try { pintar(await api('/admin/g1/config', { activo: !datos.activo })); $('panelErr').textContent = ''; }
    catch (e) { $('panelErr').textContent = e.message; }
    finally { $('interruptor').disabled = false; }
  });

  $('guardar').addEventListener('click', async () => {
    const precio = Number(String($('precio').value).replace(',', '.'));
    if (!(precio > 0)) { $('guardado').textContent = 'Precio inválido'; return; }
    try {
      pintar(await api('/admin/g1/config', { centimos: Math.round(precio * 100), cuenta: $('cuenta').value.trim() }), { campos: true });
      $('guardado').textContent = '✓ guardado';
      setTimeout(() => ($('guardado').textContent = ''), 2000);
    } catch (e) { $('guardado').textContent = e.message; }
  });

  function modal(titulo, svg, nota) {
    $('mTitulo').textContent = titulo; $('mQr').innerHTML = svg || ''; $('mNota').textContent = nota;
    $('modal').hidden = false;
  }
  $('mCerrar').addEventListener('click', () => ($('modal').hidden = true));

  $('pedidos').addEventListener('click', async (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    try {
      if (b.dataset.pagar) {
        if (b.dataset.seguro !== '1') { b.dataset.seguro = '1'; b.textContent = '¿Seguro? Tocá de nuevo'; return; }
        const p = await api('/admin/g1/pagado', { codigo: b.dataset.pagar });
        modal(`${p.codigo} · pagado`, p.qrDescarga, 'Que el comprador escanee este QR para bajar el PDF.');
        cargar(false);
      } else if (b.dataset.qr) {
        const p = await api('/admin/g1/pedido?codigo=' + encodeURIComponent(b.dataset.qr));
        modal(`${p.codigo} · descarga`, p.qrDescarga, 'Que el comprador escanee este QR para bajar el PDF.');
      }
    } catch (e) { $('panelErr').textContent = e.message; }
  });

  if (localStorage.getItem(CLAVE)) entrar(); else $('login').hidden = false;
})();
</script>
</body>
</html>
