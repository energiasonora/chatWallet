name = "chatwallet-book-api"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "b40dda71c4e4812d9dd427e06cff7de8"  # cuenta CF de chatwallet (misma que el gateway)

# El frontend (book.html) llama a https://api.chatwallet.org
# custom_domain = true → wrangler crea el record DNS + cert automáticamente
# (una "route" pelada no crea el DNS y el host queda en NXDOMAIN).
routes = [
  { pattern = "api.chatwallet.org", custom_domain = true }
]

# ── D1: compras + anti-replay de txHashes ──
# Crear con:  wrangler d1 create chatwallet-purchases
# Pegá el database_id que devuelve acá abajo.
[[d1_databases]]
binding = "DB"
database_name = "chatwallet-purchases"
database_id = "9acb2df0-243b-40a9-9a54-a90b0253225a"

# ── R2: PDF del libro ──
# Crear con:  wrangler r2 bucket create chatwallet-book
[[r2_buckets]]
binding = "BOOK_BUCKET"
bucket_name = "chatwallet-book"

# ── Config pública (no secretos) ──
[vars]
PAYMENT_ADDRESS    = "0x1c87FDF8844cbEe5DC7f0F1681C44bF3c99A0e3d"
BOOK_FILE_KEY      = "cryptoParaSoberanos-v34b.pdf"
PRICE_USD          = "10"
CHAIN_ID           = "42161"
RPC_URL            = "https://arb1.arbitrum.io/rpc"
CHAINLINK_FEED     = "0x639Fe6ab55C921f74e7fac1ee960C0B6293ba612"
SLIPPAGE_TOLERANCE = "0.05"

# TOKEN_SECRET NO va acá. Se setea como secret:
#   wrangler secret put TOKEN_SECRET
